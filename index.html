<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sky Tag — 空中鬼ごっこ</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e6edf3;
        --muted: #9fb0c0;
        --panel: rgba(13, 17, 23, 0.82);
        --line: rgba(255, 255, 255, 0.14);
        --hunter: #ff5a4a;
        --runner: #3fd0ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1117; }
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--ink);
        user-select: none;
      }
      #view { display: block; width: 100%; height: 100%; }
      #hud, #ui { position: fixed; inset: 0; pointer-events: none; }
      #ui > * { pointer-events: auto; }

      /* ---------- HUD ---------- */
      .hud-pane {
        position: absolute;
        overflow: hidden;
        font-size: 13px;
        /* A hairline between split-screen panes. */
        border-bottom: 1px solid rgba(0, 0, 0, 0.45);
      }
      .hud-top {
        position: absolute;
        top: 10px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: baseline;
        gap: 18px;
      }
      .hud-clock { font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
      .hud-clock.urgent { color: #ff7b6b; }
      .hud-score { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }

      .hud-enemy { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); width: 240px; }
      .hud-enemy-label { text-align: center; font-size: 11px; color: var(--muted); letter-spacing: 0.1em; }

      .hud-bottom {
        position: absolute;
        left: 14px;
        bottom: 12px;
        width: 260px;
        display: grid;
        gap: 5px;
      }
      .hud-role { font-size: 12px; letter-spacing: 0.08em; }

      .hud-bar { display: grid; grid-template-columns: 34px 1fr 52px; align-items: center; gap: 7px; }
      .hud-bar-enemy { grid-template-columns: 1fr 44px; }
      .hud-bar-label { font-size: 10px; color: var(--muted); }
      .hud-bar-track {
        height: 9px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid var(--line);
        border-radius: 5px;
        overflow: hidden;
      }
      .hud-bar-fill { height: 100%; width: 0; transition: width 80ms linear; }
      .hud-bar-value { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
      .hud-bar-hp .hud-bar-fill { background: linear-gradient(90deg, #4ade80, #22c55e); }
      .hud-bar-enemy .hud-bar-fill { background: linear-gradient(90deg, #f87171, #ef4444); }
      .hud-bar-boost .hud-bar-fill { background: linear-gradient(90deg, #60a5fa, #3b82f6); }
      .hud-bar-heat .hud-bar-fill { background: linear-gradient(90deg, #fbbf24, #f97316); }
      .hud-bar-heat.overheated .hud-bar-fill { background: #ef4444; }
      .hud-bar-heat.overheated .hud-bar-value { color: #ef4444; }
      .hud-bar-ammo .hud-bar-fill { background: linear-gradient(90deg, #cbd5e1, #94a3b8); }
      .hud-bar-ammo.dry .hud-bar-fill { background: #ef4444; }
      .hud-bar-ammo.dry .hud-bar-value { color: #ef4444; }
      .hud-bar-ammo.free .hud-bar-fill { background: linear-gradient(90deg, #a78bfa, #7c3aed); }
      .hud-bar-ammo.free .hud-bar-value { color: #c4b5fd; }

      .hud-items { display: flex; gap: 6px; margin-top: 3px; }
      .hud-item {
        position: relative;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 3px 7px;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid var(--line);
        border-radius: 5px;
        font-size: 10px;
        overflow: hidden;
        /* Item names run to six characters ("オーバーチャージ"), and a chip that
           wraps them is unreadable at a glance mid-fight. */
        white-space: nowrap;
        flex: none;
      }
      .hud-item-key { color: var(--muted); }
      .hud-item-charges { color: #7fd4ff; letter-spacing: 1px; }
      .hud-item.spent { opacity: 0.35; }
      .hud-item.spent .hud-item-charges { color: var(--muted); }
      .hud-item-cooldown {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        background: rgba(127, 212, 255, 0.22);
        pointer-events: none;
        transition: width 80ms linear;
      }

      /* Flash grenade: whites the pane out, then fades as the sim timer runs down. */
      .hud-blind {
        position: absolute;
        inset: 0;
        background: #ffffff;
        opacity: 0;
        transition: opacity 120ms linear;
        pointer-events: none;
      }

      .hud-crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 16px;
        height: 16px;
        margin: -8px 0 0 -8px;
        opacity: 0.75;
      }
      .hud-crosshair::before, .hud-crosshair::after { content: ''; position: absolute; background: var(--ink); }
      .hud-crosshair::before { left: 7px; top: 0; width: 2px; height: 16px; }
      .hud-crosshair::after { top: 7px; left: 0; height: 2px; width: 16px; }

      /* ---------- Radar ---------- */
      .hud-radar {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 116px;
        height: 116px;
        border-radius: 50%;
        background: rgba(8, 14, 20, 0.55);
        border: 1px solid rgba(127, 212, 255, 0.35);
        overflow: hidden;
      }
      /* Half-range ring, so distance can be read at a glance. */
      .hud-radar-ring {
        position: absolute;
        inset: 25%;
        border: 1px solid rgba(127, 212, 255, 0.18);
        border-radius: 50%;
      }
      /* The viewer: a chevron at the centre, always pointing up the screen,
         because the radar is rotated into their heading. */
      .hud-radar-self {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 0;
        height: 0;
        margin: -5px 0 0 -4px;
        border-left: 4px solid transparent;
        border-right: 4px solid transparent;
        border-bottom: 9px solid rgba(190, 225, 255, 0.85);
      }
      .hud-blip {
        position: absolute;
        width: 8px;
        height: 8px;
        margin: -4px 0 0 -4px;
        border-radius: 50%;
        background: #ff5a4a;
        box-shadow: 0 0 5px rgba(255, 90, 74, 0.8);
      }
      .hud-blip.close { background: #ff8a5a; box-shadow: 0 0 9px rgba(255, 138, 90, 0.95); }
      /* A ring above or below the dot reads as altitude without extra labels. */
      .hud-blip.above { border-top: 3px solid #ffd166; margin-top: -7px; }
      .hud-blip.below { border-bottom: 3px solid #7fd4ff; margin-top: -1px; }
      /* A live scan: the dish is lit, and the one blip on it is the real craft. */
      .hud-radar.scanning {
        border-color: rgba(138, 255, 200, 0.75);
        box-shadow: 0 0 12px rgba(138, 255, 200, 0.35) inset;
      }

      .hud-banner, .hud-subbanner {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        opacity: 0;
        transition: opacity 120ms ease;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85);
      }
      .hud-banner { top: 32%; font-size: 44px; letter-spacing: 0.1em; }
      .hud-subbanner { top: 32%; margin-top: 54px; font-size: 14px; color: var(--muted); }
      .hud-banner.visible, .hud-subbanner.visible { opacity: 1; }

      /* ---------- Menus ---------- */
      .screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(8, 11, 16, 0.88);
        backdrop-filter: blur(3px);
      }
      .panel {
        width: min(660px, calc(100vw - 48px));
        max-height: calc(100vh - 48px);
        overflow-y: auto;
        padding: 28px 32px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        text-align: center;
      }
      .title { margin: 0 0 6px; font-size: 34px; letter-spacing: 0.1em; }
      .subtitle { margin: 0 0 20px; font-size: 13px; color: var(--muted); line-height: 1.7; }
      .note { margin: 14px 0 0; font-size: 11px; color: var(--muted); line-height: 1.8; }

      .field { display: grid; grid-template-columns: 90px 1fr; align-items: center; gap: 12px; margin: 8px 0; text-align: left; }
      .field-label { font-size: 12px; color: var(--muted); }
      .field-input {
        width: 100%;
        padding: 7px 10px;
        background: #161b22;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
        font-size: 13px;
      }

      .buttons { display: grid; gap: 9px; margin-top: 20px; }
      .button {
        padding: 11px 16px;
        background: #21262d;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 8px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .button:hover:not(:disabled) { background: #2d333b; }
      .button.primary { background: #1f3a5f; border-color: #2f5f96; }
      .button.primary:hover { background: #274b79; }
      .button:disabled { opacity: 0.4; cursor: default; }

      .results { margin: 14px 0; display: grid; gap: 5px; font-size: 12px; color: var(--muted); }
      .result-row { padding: 5px 0; border-top: 1px solid var(--line); }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
